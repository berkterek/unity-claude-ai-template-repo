name: Graph Tests

# Runs the knowledge-graph integration harness (verify-graphify.sh) on every
# change under .claude/graph/. This caught the stale graph-builder.sh reference
# left behind by the Python migration — keeps the harness honest as the graph
# pipeline evolves.

on:
  push:
    branches: [main]
    paths:
      - '.claude/graph/**'
  pull_request:
    paths:
      - '.claude/graph/**'

permissions:
  contents: read

jobs:
  graph-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run graph verification harness
        run: bash .claude/graph/test/verify-graphify.sh
